spring.application.name=koi-coffee-backend
server.port=8080

# 1. Cấu hình Database Aiven Cloud (Bảo mật: Mật khẩu truyền qua biến môi trường DB_PASSWORD)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://pg-2021dbb9-ngkhg8190-6089.h.aivencloud.com:10772/defaultdb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. Tối ưu kết nối HikariCP (Timeout & Keep-alive)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# 3. Tự động đồng bộ cấu trúc bảng và Index
spring.jpa.hibernate.ddl-auto=update

# Tắt show-sql trên production để tăng tốc xử lý và tránh tràn log
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
