spring.application.name=koi-coffee-backend
server.port=8080

# 1. Cấu hình Database Aiven Cloud (Mật khẩu nhận từ biến môi trường DB_PASSWORD)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://pg-2021dbb9-ngkhg8190-6089.h.aivencloud.com:10772/defaultdb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. Cấu hình Dialect rõ ràng cho Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 3. TỐI ƯU HIKARICP CHO CLOUD DATABASE (Tránh lỗi: remaining connection slots)
# Aiven gói Free/Hobby giới hạn số connection rất thấp (~20). 
# Đặt maximum-pool-size = 3 để khi Render deploy rolling (chạy 2 pod song song) không bị tràn slot!
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=60000

# 4. Tự động đồng bộ cấu trúc bảng và Index
spring.jpa.hibernate.ddl-auto=update

# Tắt log SQL trên production để tăng tốc
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
